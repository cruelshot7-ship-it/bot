<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Запись на тренировку</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141310;
  --surface:#1e1c18;
  --surface-alt:#26241f;
  --hairline:#332f28;
  --text:#ece7dc;
  --text-dim:#8a8377;
  --accent:#b23b2e;
  --accent-dim:rgba(178,59,46,0.16);
  --ok:#7a8f6e;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans', sans-serif;
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding-bottom:88px;
}
header{
  padding:20px 20px 12px;
  border-bottom:1px solid var(--hairline);
}
.brand{
  font-size:11px;
  letter-spacing:0.14em;
  color:var(--text-dim);
  margin:0 0 6px;
}
h1{
  font-family:'Oswald', sans-serif;
  font-weight:600;
  font-size:24px;
  margin:0;
  letter-spacing:0.01em;
}
.tabs{
  display:flex;
  gap:4px;
  padding:14px 20px 0;
}
.tab{
  flex:1;
  text-align:center;
  padding:10px 0;
  font-size:13px;
  font-weight:500;
  color:var(--text-dim);
  border-bottom:2px solid var(--hairline);
  cursor:pointer;
  background:none;
  border-top:none;
  border-left:none;
  border-right:none;
  font-family:inherit;
}
.tab.active{
  color:var(--text);
  border-bottom:2px solid var(--accent);
}
.week-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px 10px;
}
.week-nav .range{
  font-family:'Oswald', sans-serif;
  font-size:14px;
  letter-spacing:0.06em;
  color:var(--text-dim);
}
.week-nav button{
  background:var(--surface);
  border:1px solid var(--hairline);
  color:var(--text);
  width:32px;
  height:32px;
  border-radius:4px;
  font-size:16px;
  cursor:pointer;
}
.week-nav button:disabled{
  opacity:0.3;
  cursor:default;
}
.day-strip{
  display:flex;
  gap:6px;
  padding:4px 20px 16px;
  overflow-x:auto;
}
.day-chip{
  flex:1;
  min-width:44px;
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:6px;
  padding:8px 4px;
  text-align:center;
  cursor:pointer;
}
.day-chip .dow{
  font-size:10px;
  color:var(--text-dim);
  letter-spacing:0.06em;
}
.day-chip .num{
  font-family:'Oswald', sans-serif;
  font-size:17px;
  font-weight:600;
  margin:2px 0;
}
.day-chip .count{
  font-size:9px;
  color:var(--text-dim);
}
.day-chip.selected{
  border-color:var(--accent);
  background:var(--accent-dim);
}
.day-chip.empty .count{color:var(--text-dim);}
section.slots{
  padding:0 20px;
}
.slots-title{
  font-family:'Oswald', sans-serif;
  font-size:13px;
  letter-spacing:0.08em;
  color:var(--text-dim);
  margin:4px 0 10px;
}
.slot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 14px;
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:6px;
  margin-bottom:8px;
  cursor:pointer;
}
.slot.selected{
  border-color:var(--accent);
  background:var(--accent-dim);
}
.slot.full{
  opacity:0.45;
  cursor:default;
}
.slot .time{
  font-family:'Oswald', sans-serif;
  font-size:18px;
  font-weight:600;
  min-width:56px;
}
.slot .meta{
  flex:1;
  padding-left:12px;
  font-size:12px;
  color:var(--text-dim);
}
.slot .status{
  font-size:12px;
  font-weight:500;
}
.slot .status.open{color:var(--ok);}
.slot .status.full{color:var(--text-dim);}
.empty-state{
  padding:32px 4px;
  color:var(--text-dim);
  font-size:13px;
  line-height:1.5;
}
.booking-card{
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:6px;
  padding:16px;
  margin:0 20px 12px;
}
.booking-card .date{
  font-family:'Oswald', sans-serif;
  font-size:16px;
  font-weight:600;
}
.booking-card .time-row{
  font-size:12px;
  color:var(--text-dim);
  margin-top:4px;
}
.booking-card .cancel{
  margin-top:12px;
  background:none;
  border:1px solid var(--hairline);
  color:var(--text-dim);
  font-size:12px;
  padding:8px 12px;
  border-radius:4px;
  cursor:pointer;
  font-family:inherit;
}
.cta-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 60%, transparent);
}
.cta-bar .inner{
  width:100%;
  max-width:440px;
}
.cta-btn{
  width:100%;
  background:var(--accent);
  color:#fff;
  border:none;
  padding:15px;
  border-radius:6px;
  font-family:'IBM Plex Sans', sans-serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:0.02em;
  cursor:pointer;
}
.cta-btn:disabled{
  background:var(--surface-alt);
  color:var(--text-dim);
  cursor:default;
}
.toast{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  background:var(--surface);
  border:1px solid var(--accent);
  color:var(--text);
  padding:10px 16px;
  border-radius:6px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.25s ease;
  max-width:calc(100% - 40px);
  text-align:center;
  z-index:10;
}
.toast.show{opacity:1;}
/* ---------- Тренер ---------- */
.subtabs{display:flex; gap:6px; padding:0 20px 12px;}
.subtab{
  flex:1; text-align:center; padding:8px 0; font-size:12px; font-weight:500;
  color:var(--text-dim); background:var(--surface); border:1px solid var(--hairline);
  border-radius:6px; cursor:pointer; font-family:inherit;
}
.subtab.active{color:var(--text); border-color:var(--accent); background:var(--accent-dim);}
.pill-btn{
  background:var(--surface-alt); color:var(--text); border:1px solid var(--hairline);
  padding:10px 14px; border-radius:6px; font-size:13px; font-weight:500;
  cursor:pointer; font-family:inherit; margin-right:8px; margin-top:4px;
}
.pill-btn:active{border-color:var(--accent);}
.admin-input{
  background:var(--surface-alt); border:1px solid var(--hairline);
  color:var(--text); padding:10px 12px; border-radius:6px; font-size:13px;
  font-family:inherit; box-sizing:border-box;
}
.admin-input.wide{width:100%;}
.admin-textarea{
  width:100%; min-height:90px; background:var(--surface-alt); border:1px solid var(--hairline);
  color:var(--text); padding:10px 12px; border-radius:6px; font-size:13px;
  font-family:inherit; resize:vertical; box-sizing:border-box;
}
.client-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px; background:var(--surface); border:1px solid var(--hairline);
  border-radius:6px; margin-bottom:8px; cursor:pointer;
}
.client-row .name{font-size:14px; font-weight:500;}
.client-row .sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
.client-row .arrow{color:var(--text-dim); font-size:16px;}
.roster-nav{display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
.roster-slot{
  padding:12px 14px; background:var(--surface); border:1px solid var(--hairline);
  border-radius:6px; margin-bottom:8px;
}
.roster-slot .t{font-family:'Oswald',sans-serif; font-weight:600; font-size:15px;}
.roster-slot .names{font-size:12px; color:var(--text-dim); margin-top:4px;}
.field-label{font-size:11px; color:var(--text-dim); margin:10px 0 4px; letter-spacing:0.04em;}
.save-row{display:flex; gap:8px; margin-top:10px;}
.kbju-row{display:flex; gap:6px;}
.kbju-row .admin-input{flex:1; min-width:0;}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <p class="brand">ФИТНЕС ФРАКЦИЯ</p>
    <h1>Запись на тренировку</h1>
  </header>

  <div class="tabs">
    <button class="tab active" id="tabBook" onclick="setView('book')">Слоты</button>
    <button class="tab" id="tabMine" onclick="setView('mine')">Мои записи</button>
    <button class="tab" id="tabProgram" onclick="setView('program')">Моя программа</button>
    <button class="tab" id="tabTrainer" style="display:none;" onclick="setView('trainer')">Тренер</button>
  </div>

  <div id="bookView">
    <div class="week-nav">
      <button id="prevWeek" onclick="shiftWeek(-1)">‹</button>
      <span class="range" id="weekRange"></span>
      <button id="nextWeek" onclick="shiftWeek(1)">›</button>
    </div>
    <div class="day-strip" id="dayStrip"></div>
    <section class="slots">
      <p class="slots-title" id="slotsTitle"></p>
      <div id="slotsList"></div>
    </section>
  </div>

  <div id="mineView" style="display:none; padding-top:16px;">
    <div id="mineList"></div>
  </div>

  <div id="programView" style="display:none; padding-top:16px;">
    <div id="programContent"></div>
  </div>

  <div id="trainerView" style="display:none; padding-top:16px;">
    <div class="subtabs">
      <button class="subtab active" data-sub="schedule" onclick="setTrainerSub('schedule')">Расписание</button>
      <button class="subtab" data-sub="clients" onclick="setTrainerSub('clients')">Клиенты</button>
      <button class="subtab" data-sub="roster" onclick="setTrainerSub('roster')">Кто записан</button>
    </div>

    <div id="trainerScheduleView" style="padding:0 20px;">
      <div class="booking-card" style="margin-left:0; margin-right:0;">
        <div class="date">Стандартное расписание</div>
        <div class="time-row" style="margin-bottom:12px;">Будни 07:00–19:00, суббота 10:00–11:00</div>
        <button class="pill-btn" onclick="applyPreset('weekday')">Поставить будни</button>
        <button class="pill-btn" onclick="applyPreset('saturday')">Поставить субботу</button>
      </div>
      <div class="booking-card" style="margin-left:0; margin-right:0;">
        <div class="date">Своё расписание</div>
        <div class="time-row" style="margin-bottom:8px;">Дни через запятую (пн,вт,ср,чт,пт,сб,вс) и время через запятую</div>
        <input class="admin-input wide" id="customDays" placeholder="пн,вт,ср,чт,пт">
        <input class="admin-input wide" id="customTimes" placeholder="07:00,08:00,19:00" style="margin-top:8px;">
        <button class="pill-btn" style="margin-top:10px;" onclick="applyCustomSchedule()">Поставить</button>
      </div>
      <div id="scheduleStatus" class="empty-state" style="display:none; padding:0 0 16px;"></div>
    </div>

    <div id="trainerClientsView" style="display:none; padding:0 20px;">
      <div id="clientsList"></div>
      <div id="clientDetail"></div>
    </div>

    <div id="trainerRosterView" style="display:none; padding:0 20px;">
      <div class="roster-nav">
        <button class="pill-btn" onclick="loadRoster('today')">Сегодня</button>
        <button class="pill-btn" onclick="loadRoster('tomorrow')">Завтра</button>
        <input type="date" id="rosterDate" class="admin-input" onchange="loadRoster('custom')">
      </div>
      <div id="rosterList"></div>
    </div>
  </div>

  <div class="cta-bar" id="ctaBar" style="display:none;">
    <div class="inner">
      <button class="cta-btn" id="ctaBtn" onclick="confirmBooking()">Подтвердить</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   TELEGRAM WEB APP HOOKS
   These are the only lines that matter once this is opened
   inside real Telegram (BotFather -> Menu Button -> Web App URL).
   In a normal browser tab, tg stays undefined and everything
   below falls back to the in-page CTA bar, so you can preview
   this file directly without a bot.
   ============================================================ */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#141310'); } catch(e) {}
  try { tg.setBackgroundColor('#141310'); } catch(e) {}
}

/* ============================================================
   DATA LAYER
   Auto-detects deployment: opened as a local file (double-click,
   file://) => preview mode with mock data, no backend needed.
   Served over http(s) by booking_api.py (same origin) => calls
   the real API at relative /api/... paths automatically.
   ============================================================ */
const USE_API = window.location.protocol !== 'file:';
const API_BASE = ''; // same-origin; only set to a different host if you split services

function pad(n){ return n < 10 ? '0'+n : ''+n; }
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function startOfWeek(d){
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // Monday = 0
  date.setDate(date.getDate() - day);
  date.setHours(0,0,0,0);
  return date;
}

const DOW = ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const TIMES = ['07:00','09:00','12:00','15:00','18:00','19:30'];

function fetchSlotsMock(weekStart){
  const slots = {};
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    const key = isoDate(d);
    // deterministic mock: skip Sunday, occupy every 3rd slot
    if (i === 6) { slots[key] = []; continue; }
    slots[key] = TIMES.map((t, idx) => ({
      id: key + '_' + t,
      time: t,
      duration: 60,
      capacity: 2,
      booked: (idx % 3 === 0) ? 2 : (idx % 3 === 1 ? 1 : 0),
    }));
  }
  return slots;
}

async function fetchSlotsApi(weekStart){
  const res = await fetch(`${API_BASE}/api/slots?week_start=${isoDate(weekStart)}`);
  if (!res.ok) throw new Error('slots fetch failed: ' + res.status);
  return res.json();
}

async function loadWeekSlots(weekStart){
  const key = isoDate(weekStart);
  if (state.slotsByWeek[key]) return state.slotsByWeek[key];
  let slots;
  if (USE_API) {
    try { slots = await fetchSlotsApi(weekStart); }
    catch (e) { console.error('API unreachable, showing mock data', e); slots = fetchSlotsMock(weekStart); }
  } else {
    slots = fetchSlotsMock(weekStart);
  }
  state.slotsByWeek[key] = slots;
  return slots;
}

async function submitBookingRemote(slotId){
  if (!USE_API) return null;
  const res = await fetch(`${API_BASE}/api/bookings`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ slot_id: slotId, init_data: tg ? tg.initData : '' }),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function cancelBookingRemote(bookingId){
  if (!USE_API) return null;
  const res = await fetch(`${API_BASE}/api/bookings/${bookingId}`, {
    method: 'DELETE',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ init_data: tg ? tg.initData : '' }),
  });
  if (!res.ok) throw new Error(await res.text());
}

async function fetchMeRemote(){
  if (!USE_API || !tg) return null;
  const res = await fetch(`${API_BASE}/api/me?init_data=${encodeURIComponent(tg.initData)}`);
  if (!res.ok) throw new Error('me fetch failed: ' + res.status);
  return res.json();
}

async function renderProgram(){
  const el = document.getElementById('programContent');
  if (!USE_API || !tg) {
    el.innerHTML = `<div class="empty-state" style="padding:32px 20px;">Программа и КБЖУ видны только внутри Telegram, после подключения к боту.</div>`;
    return;
  }
  try {
    const me = await fetchMeRemote();
    const p = me.program || {};
    const k = me.kbju || {};
    const t = me.today || {};
    el.innerHTML = `
      <div class="booking-card">
        <div class="date">Моя программа</div>
        <div class="time-row">${p.text ? p.text : 'Программа ещё не назначена'}</div>
      </div>
      <div class="booking-card">
        <div class="date">КБЖУ — цель</div>
        <div class="time-row">
          Калории: ${k.calories ?? '—'} · Белки: ${k.protein ?? '—'} · Жиры: ${k.fat ?? '—'} · Углеводы: ${k.carbs ?? '—'}
        </div>
      </div>
      <div class="booking-card">
        <div class="date">Съедено сегодня</div>
        <div class="time-row">
          ${t.entries ? `Калории: ${t.calories} · Белки: ${t.protein} · Жиры: ${t.fat} · Углеводы: ${t.carbs}` : 'Пока ничего не залогировано — пришли фото еды боту.'}
        </div>
      </div>`;
  } catch (e) {
    console.error(e);
    el.innerHTML = `<div class="empty-state" style="padding:32px 20px;">Не получилось загрузить программу. Попробуй ещё раз.</div>`;
  }
}

async function fetchMyBookingsRemote(){
  if (!USE_API || !tg) return null;
  const res = await fetch(`${API_BASE}/api/my-bookings?init_data=${encodeURIComponent(tg.initData)}`);
  if (!res.ok) throw new Error('my-bookings fetch failed: ' + res.status);
  const rows = await res.json();
  return rows.map(r => ({ id: r.id, date: new Date(r.date), time: r.time, duration: r.duration }));
}

/* ============================================================
   STATE + RENDER
   ============================================================ */
const today = new Date();
const state = {
  view: 'book',
  weekStart: startOfWeek(today),
  selectedDate: isoDate(today),
  selectedSlotId: null,
  slotsByWeek: {},
  myBookings: [
    // one seeded example so "Мои записи" isn't empty on first look
  ],
};

function setView(v){
  state.view = v;
  document.getElementById('bookView').style.display = v === 'book' ? '' : 'none';
  document.getElementById('mineView').style.display = v === 'mine' ? '' : 'none';
  document.getElementById('programView').style.display = v === 'program' ? '' : 'none';
  document.getElementById('trainerView').style.display = v === 'trainer' ? '' : 'none';
  document.getElementById('tabBook').classList.toggle('active', v === 'book');
  document.getElementById('tabMine').classList.toggle('active', v === 'mine');
  document.getElementById('tabProgram').classList.toggle('active', v === 'program');
  document.getElementById('tabTrainer').classList.toggle('active', v === 'trainer');
  renderCta();
  if (v === 'mine') renderMine();
  if (v === 'program') renderProgram();
  if (v === 'trainer') renderTrainer();
}

async function shiftWeek(dir){
  const d = new Date(state.weekStart);
  d.setDate(d.getDate() + dir * 7);
  const now = startOfWeek(today);
  if (d < now) return; // no booking into the past
  state.weekStart = d;
  state.selectedDate = isoDate(new Date(d));
  state.selectedSlotId = null;
  await renderAll();
}

async function selectDay(dateKey){
  state.selectedDate = dateKey;
  state.selectedSlotId = null;
  const slots = await loadWeekSlots(state.weekStart);
  renderDayStrip(slots);
  renderSlots(slots);
  renderCta(slots);
}

async function selectSlot(slotId, full){
  if (full) return;
  state.selectedSlotId = (state.selectedSlotId === slotId) ? null : slotId;
  const slots = await loadWeekSlots(state.weekStart);
  renderSlots(slots);
  renderCta(slots);
}

function renderWeekRange(){
  const start = state.weekStart;
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  const label = start.getDate() + '–' + end.getDate() + ' ' + MONTHS[end.getMonth()];
  document.getElementById('weekRange').textContent = label.toUpperCase();
  document.getElementById('prevWeek').disabled = state.weekStart <= startOfWeek(today);
}

function renderDayStrip(slots){
  const strip = document.getElementById('dayStrip');
  strip.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(state.weekStart);
    d.setDate(d.getDate() + i);
    const key = isoDate(d);
    const daySlots = slots[key] || [];
    const open = daySlots.filter(s => s.booked < s.capacity).length;
    const chip = document.createElement('div');
    chip.className = 'day-chip' + (key === state.selectedDate ? ' selected' : '') + (open === 0 ? ' empty' : '');
    chip.onclick = () => selectDay(key);
    chip.innerHTML = `<div class="dow">${DOW[i]}</div><div class="num">${d.getDate()}</div><div class="count">${open ? open + ' своб.' : '—'}</div>`;
    strip.appendChild(chip);
  }
}

function renderSlots(weekSlots){
  const slots = weekSlots[state.selectedDate] || [];
  const list = document.getElementById('slotsList');
  const d = new Date(state.selectedDate);
  const titleDate = d.getDate() + ' ' + MONTHS[d.getMonth()];
  document.getElementById('slotsTitle').textContent = titleDate.toUpperCase();
  if (slots.length === 0) {
    list.innerHTML = `<div class="empty-state">На этот день слотов нет. Посмотри соседние дни или следующую неделю.</div>`;
    return;
  }
  list.innerHTML = slots.map(s => {
    const full = s.booked >= s.capacity;
    const left = s.capacity - s.booked;
    const selected = s.id === state.selectedSlotId;
    return `
      <div class="slot ${selected ? 'selected' : ''} ${full ? 'full' : ''}" onclick="selectSlot('${s.id}', ${full})">
        <div class="time">${s.time}</div>
        <div class="meta">${s.duration} мин</div>
        <div class="status ${full ? 'full' : 'open'}">${full ? 'занято' : left + ' место' + (left === 1 ? '' : (left < 5 ? 'а' : ''))}</div>
      </div>`;
  }).join('');
}

function renderCta(weekSlots){
  const bar = document.getElementById('ctaBar');
  if (state.view !== 'book' || !state.selectedSlotId) {
    bar.style.display = 'none';
    if (tg) tg.MainButton.hide();
    return;
  }
  const slots = (weekSlots || {})[state.selectedDate] || [];
  const slot = slots.find(s => s.id === state.selectedSlotId);
  if (!slot) { bar.style.display = 'none'; return; }
  const d = new Date(state.selectedDate);
  const label = 'Подтвердить · ' + DOW[(d.getDay()+6)%7] + ' ' + slot.time;
  if (tg) {
    bar.style.display = 'none';
    tg.MainButton.setParams({ text: label.toUpperCase(), color: '#b23b2e', is_active: true });
    tg.MainButton.show();
    tg.MainButton.offClick(confirmBooking);
    tg.MainButton.onClick(confirmBooking);
  } else {
    bar.style.display = 'flex';
    document.getElementById('ctaBtn').textContent = label;
  }
}

async function confirmBooking(){
  const weekSlots = await loadWeekSlots(state.weekStart);
  const slots = weekSlots[state.selectedDate] || [];
  const slot = slots.find(s => s.id === state.selectedSlotId);
  if (!slot || slot.booked >= slot.capacity) return;
  const d = new Date(state.selectedDate);
  try {
    if (USE_API) {
      const res = await submitBookingRemote(slot.id);
      state.myBookings.push({ id: res.booking_id, date: d, time: slot.time, duration: slot.duration });
    } else {
      state.myBookings.push({ id: 'bk_' + slot.id, date: d, time: slot.time, duration: slot.duration });
    }
    slot.booked += 1;
  } catch (e) {
    showToast('Не получилось записаться. Попробуй ещё раз.');
    console.error(e);
    return;
  }
  state.selectedSlotId = null;
  showToast('Готово. Встретимся ' + DOW[(d.getDay()+6)%7].toLowerCase() + ' в ' + slot.time + '.');
  await renderAll();
}

async function renderMine(){
  const list = document.getElementById('mineList');
  if (USE_API) {
    try {
      const remote = await fetchMyBookingsRemote();
      if (remote) state.myBookings = remote;
    } catch (e) { console.error('could not load bookings', e); }
  }
  if (state.myBookings.length === 0) {
    list.innerHTML = `<div class="empty-state" style="padding:32px 20px;">Пока нет активных записей. Выбери время на вкладке «Свободные слоты».</div>`;
    return;
  }
  list.innerHTML = state.myBookings.map(b => {
    const dow = DOW[(b.date.getDay()+6)%7];
    const dateLabel = dow + ', ' + b.date.getDate() + ' ' + MONTHS[b.date.getMonth()];
    return `
      <div class="booking-card">
        <div class="date">${dateLabel}</div>
        <div class="time-row">${b.time} · ${b.duration} мин</div>
        <button class="cancel" onclick="cancelBookingUI('${b.id}')">Отменить запись</button>
      </div>`;
  }).join('');
}

async function cancelBookingUI(id){
  try {
    if (USE_API) await cancelBookingRemote(id);
    state.myBookings = state.myBookings.filter(b => b.id !== id);
    await renderMine();
    showToast('Запись отменена.');
  } catch (e) {
    showToast('Не получилось отменить запись.');
    console.error(e);
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   TRAINER PANEL (мини-эп, вкладка "Тренер")
   Показывается только тем, для кого /api/admin/whoami вернёт
   is_trainer: true — но это только UI-удобство: каждый write-
   эндпоинт на бэке сам заново проверяет TRAINER_TG_ID.
   ============================================================ */
let trainerSub = 'schedule';
let clientsCache = null;

async function fetchAdminWhoami(){
  if (!USE_API || !tg) return false;
  try {
    const res = await fetch(`${API_BASE}/api/admin/whoami?init_data=${encodeURIComponent(tg.initData)}`);
    if (!res.ok) return false;
    const data = await res.json();
    return !!data.is_trainer;
  } catch(e) { console.error(e); return false; }
}

async function checkTrainerAccess(){
  const isTrainer = await fetchAdminWhoami();
  if (isTrainer) document.getElementById('tabTrainer').style.display = '';
}

function setTrainerSub(sub){
  trainerSub = sub;
  document.querySelectorAll('.subtab').forEach(b => b.classList.toggle('active', b.dataset.sub === sub));
  document.getElementById('trainerScheduleView').style.display = sub === 'schedule' ? '' : 'none';
  document.getElementById('trainerClientsView').style.display = sub === 'clients' ? '' : 'none';
  document.getElementById('trainerRosterView').style.display = sub === 'roster' ? '' : 'none';
  if (sub === 'clients') renderTrainerClients();
  if (sub === 'roster') loadRoster('today');
}

async function renderTrainer(){
  setTrainerSub(trainerSub);
}

async function postAdminWeekly(days, times){
  const res = await fetch(`${API_BASE}/api/admin/weekly`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ init_data: tg ? tg.initData : '', days, times }),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function applyPreset(kind){
  const status = document.getElementById('scheduleStatus');
  status.style.display = '';
  status.textContent = 'Ставлю...';
  const body = kind === 'weekday'
    ? { days: ['пн','вт','ср','чт','пт'], times: ['07:00','08:00','08:30','09:00','10:00','16:30','19:00'] }
    : { days: ['сб'], times: ['10:00','11:00'] };
  try {
    await postAdminWeekly(body.days, body.times);
    status.textContent = 'Готово: ' + body.days.join(',') + ' — ' + body.times.join(',');
    state.slotsByWeek = {}; // сбрасываем кэш, чтобы вкладка «Слоты» подтянула новые данные
  } catch(e) {
    status.textContent = 'Не получилось. Попробуй ещё раз.';
    console.error(e);
  }
}

async function applyCustomSchedule(){
  const status = document.getElementById('scheduleStatus');
  const days = document.getElementById('customDays').value.split(',').map(s => s.trim()).filter(Boolean);
  const times = document.getElementById('customTimes').value.split(',').map(s => s.trim()).filter(Boolean);
  if (!days.length || !times.length) {
    status.style.display = '';
    status.textContent = 'Заполни дни и время.';
    return;
  }
  status.style.display = '';
  status.textContent = 'Ставлю...';
  try {
    await postAdminWeekly(days, times);
    status.textContent = 'Готово: ' + days.join(',') + ' — ' + times.join(',');
    state.slotsByWeek = {};
  } catch(e) {
    status.textContent = 'Не получилось. Проверь формат (дни на русском, время ЧЧ:ММ).';
    console.error(e);
  }
}

async function fetchAdminClients(){
  const res = await fetch(`${API_BASE}/api/admin/clients?init_data=${encodeURIComponent(tg.initData)}`);
  if (!res.ok) throw new Error('clients fetch failed: ' + res.status);
  return res.json();
}

async function renderTrainerClients(){
  const list = document.getElementById('clientsList');
  document.getElementById('clientDetail').innerHTML = '';
  list.innerHTML = `<div class="empty-state">Загрузка...</div>`;
  try {
    clientsCache = await fetchAdminClients();
  } catch(e) {
    list.innerHTML = `<div class="empty-state">Не получилось загрузить клиентов.</div>`;
    console.error(e);
    return;
  }
  if (!clientsCache.length) {
    list.innerHTML = `<div class="empty-state">Пока никто не открывал мини-эп.</div>`;
    return;
  }
  list.innerHTML = clientsCache.map(c => {
    const label = c.first_name || String(c.telegram_id);
    const hasProgram = !!c.program_text;
    const hasKbju = c.calories !== null && c.calories !== undefined;
    return `
      <div class="client-row" onclick="openClient(${c.telegram_id})">
        <div>
          <div class="name">${label}${c.username ? ' · @' + c.username : ''}</div>
          <div class="sub">${hasProgram ? 'программа назначена' : 'без программы'}${hasKbju ? ' · КБЖУ задан' : ' · КБЖУ не задан'}</div>
        </div>
        <div class="arrow">›</div>
      </div>`;
  }).join('');
}

function openClient(id){
  const c = clientsCache.find(x => x.telegram_id === id);
  const detail = document.getElementById('clientDetail');
  if (!c) { detail.innerHTML = ''; return; }
  detail.innerHTML = `
    <div class="booking-card" style="margin-left:0; margin-right:0;">
      <div class="date">${c.first_name || id}</div>
      <div class="field-label">Программа</div>
      <textarea class="admin-textarea" id="programInput">${c.program_text ? c.program_text.replace(/</g,'&lt;') : ''}</textarea>
      <div class="save-row">
        <button class="pill-btn" onclick="saveProgram(${id})">Сохранить программу</button>
      </div>
      <div class="field-label">КБЖУ — калории / белки / жиры / углеводы</div>
      <div class="kbju-row">
        <input class="admin-input" id="kCal" placeholder="ккал" value="${c.calories ?? ''}">
        <input class="admin-input" id="kProt" placeholder="белки" value="${c.protein ?? ''}">
        <input class="admin-input" id="kFat" placeholder="жиры" value="${c.fat ?? ''}">
        <input class="admin-input" id="kCarb" placeholder="углеводы" value="${c.carbs ?? ''}">
      </div>
      <div class="save-row">
        <button class="pill-btn" onclick="saveKbju(${id})">Сохранить КБЖУ</button>
      </div>
      <div id="clientStatus" class="sub" style="margin-top:8px; color:var(--text-dim);"></div>
    </div>`;
}

async function saveProgram(id){
  const text = document.getElementById('programInput').value;
  const status = document.getElementById('clientStatus');
  status.textContent = 'Сохраняю...';
  try {
    const res = await fetch(`${API_BASE}/api/admin/clients/${id}/program`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ init_data: tg.initData, program_text: text }),
    });
    if (!res.ok) throw new Error(await res.text());
    status.textContent = 'Программа сохранена.';
  } catch(e) {
    status.textContent = 'Не получилось сохранить.';
    console.error(e);
  }
}

async function saveKbju(id){
  const status = document.getElementById('clientStatus');
  const calories = parseInt(document.getElementById('kCal').value, 10);
  const protein = parseInt(document.getElementById('kProt').value, 10);
  const fat = parseInt(document.getElementById('kFat').value, 10);
  const carbs = parseInt(document.getElementById('kCarb').value, 10);
  if ([calories, protein, fat, carbs].some(n => Number.isNaN(n))) {
    status.textContent = 'Заполни все 4 числа.';
    return;
  }
  status.textContent = 'Сохраняю...';
  try {
    const res = await fetch(`${API_BASE}/api/admin/clients/${id}/kbju`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ init_data: tg.initData, calories, protein, fat, carbs }),
    });
    if (!res.ok) throw new Error(await res.text());
    status.textContent = 'КБЖУ сохранены.';
  } catch(e) {
    status.textContent = 'Не получилось сохранить.';
    console.error(e);
  }
}

async function loadRoster(which){
  const input = document.getElementById('rosterDate');
  let d;
  if (which === 'today') d = new Date();
  else if (which === 'tomorrow') { d = new Date(); d.setDate(d.getDate() + 1); }
  else d = input.value ? new Date(input.value) : new Date();
  const key = isoDate(d);
  input.value = key;
  const list = document.getElementById('rosterList');
  list.innerHTML = `<div class="empty-state">Загрузка...</div>`;
  try {
    const res = await fetch(`${API_BASE}/api/admin/roster?date=${key}&init_data=${encodeURIComponent(tg.initData)}`);
    if (!res.ok) throw new Error('roster fetch failed: ' + res.status);
    const rows = await res.json();
    if (!rows.length) {
      list.innerHTML = `<div class="empty-state">На ${key} слотов нет.</div>`;
      return;
    }
    list.innerHTML = rows.map(r => `
      <div class="roster-slot">
        <div class="t">${r.time} (${r.booked}/${r.capacity})</div>
        <div class="names">${r.names.length ? r.names.join(', ') : 'пусто'}</div>
      </div>`).join('');
  } catch(e) {
    list.innerHTML = `<div class="empty-state">Не получилось загрузить.</div>`;
    console.error(e);
  }
}

async function renderAll(){
  renderWeekRange();
  const slots = await loadWeekSlots(state.weekStart);
  renderDayStrip(slots);
  renderSlots(slots);
  renderCta(slots);
}

renderAll();
checkTrainerAccess();
</script>
</body>
