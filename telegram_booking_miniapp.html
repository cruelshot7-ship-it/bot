<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ФИТНЕС ФРАКЦИЯ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#141310;--card:#1e1c18;--line:#332f28;--text:#ece7dc;--muted:#918a7e;--accent:#b23b2e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:30px}
header{padding:22px 18px 14px;border-bottom:1px solid var(--line)}
.brand{font-size:11px;letter-spacing:.16em;color:var(--muted)}h1{margin:6px 0 0;font-size:24px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:12px 18px}
nav button,.btn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:10px;font-weight:600}
nav button.active{border-color:var(--accent);background:#2a1b18}
main{padding:0 18px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:12px 0}
.day{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day button{padding:8px 2px;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:5px}.day .sel{border-color:var(--accent);color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:14px;margin:8px 0}
.slot{display:flex;justify-content:space-between;align-items:center;cursor:pointer}.slot strong{font-size:18px}.slot.disabled{opacity:.45;cursor:default}
.selected{border-color:var(--accent)!important;background:#2a1b18!important}
.big{width:100%;padding:13px;background:var(--accent);color:#fff;border:0;border-radius:6px;font-weight:700;margin-top:10px}
input,textarea{width:100%;padding:10px;background:#26241f;border:1px solid var(--line);color:var(--text);border-radius:6px;margin:4px 0}
.muted{color:var(--muted);font-size:12px}.hidden{display:none}.ok{color:#9ab08a}.err{color:#d97a70}
</style>
</head>
<body><div class="app">
<header><div class="brand">ФИТНЕС ФРАКЦИЯ</div><h1>Запись на тренировку</h1></header>
<nav>
<button id="b0" class="active" onclick="view('book')">Слоты</button>
<button id="b1" onclick="view('mine')">Мои</button>
<button id="b2" onclick="view('program')">Программа</button>
<button id="b3" style="display:none" onclick="view('trainer')">Тренер</button>
</nav>
<main>
<section id="book">
<div class="row"><button class="btn" onclick="week(-1)">‹</button><strong id="range"></strong><button class="btn" onclick="week(1)">›</button></div>
<div id="days" class="day"></div><div id="slots"></div><button id="confirm" class="big hidden" onclick="book()">Записаться</button>
</section>
<section id="mine" class="hidden"><div id="mineList"></div></section>
<section id="program" class="hidden"><div id="programData"></div></section>
<section id="trainer" class="hidden">
<div class="card"><b>Постоянное расписание</b><p class="muted">Можно добавить несколько дней и времён.</p>
<input id="tdays" placeholder="пн,вт,ср,чт,пт"><input id="ttimes" placeholder="07:00,08:00,19:00">
<button class="btn" onclick="saveWeekly()">Сохранить расписание</button><div id="tstatus" class="muted"></div></div>
<div id="clients"></div><div id="client"></div>
</section>
</main></div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const api=""; const state={week:startOfWeek(new Date()),selected:new Date(),slots:{},slot:null};
const names=["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];
const months=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
function pad(n){return String(n).padStart(2,"0")} function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function startOfWeek(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
async function get(url,opt){let r=await fetch(api+url,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
function view(v){["book","mine","program","trainer"].forEach((x,i)=>{document.getElementById(x).classList.toggle("hidden",x!==v);document.getElementById("b"+i).classList.toggle("active",x===v)}); if(v==="mine")loadMine();if(v==="program")loadProgram();if(v==="trainer")loadTrainer()}
async function loadWeek(){const k=iso(state.week);state.slots=await get("/api/slots?week_start="+k);render()}
function week(n){let d=new Date(state.week);d.setDate(d.getDate()+7*n);if(d<startOfWeek(new Date()))return;state.week=d;state.selected=new Date(d);state.slot=null;loadWeek()}
function render(){let s=state.week,e=new Date(s);e.setDate(e.getDate()+6);document.getElementById("range").textContent=`${s.getDate()}–${e.getDate()} ${months[e.getMonth()]}`;let days="";for(let i=0;i<7;i++){let d=new Date(s);d.setDate(d.getDate()+i);let k=iso(d),open=(state.slots[k]||[]).filter(x=>x.booked<x.capacity).length;days+=`<button class="${k===iso(state.selected)?"sel":""}" onclick="selectDay('${k}')">${names[i]}<br>${d.getDate()}<br><span class="muted">${open}</span></button>`}document.getElementById("days").innerHTML=days;renderSlots()}
function selectDay(k){state.selected=new Date(k+"T00:00:00");state.slot=null;render()}
function renderSlots(){let k=iso(state.selected),a=state.slots[k]||[];document.getElementById("slots").innerHTML=a.length?a.map(x=>{let full=x.booked>=x.capacity;return `<div class="card slot ${full?"disabled":""} ${state.slot===x.id?"selected":""}" onclick="${full?"":"pick('"+x.id+"')"}"><strong>${x.time}</strong><span class="muted">${x.duration} мин</span><span>${full?"занято":x.capacity-x.booked+" мест"}</span></div>`}).join(""):`<div class="card muted">На этот день слотов нет.</div>`;document.getElementById("confirm").classList.toggle("hidden",!state.slot)}
function pick(id){state.slot=state.slot===id?null:id;renderSlots()}
async function book(){if(!state.slot)return;try{await get("/api/bookings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slot_id:state.slot,init_data:tg?.initData||""})});alert("Запись подтверждена");state.slot=null;await loadWeek()}catch(e){alert("Не получилось записаться: "+e.message)}}
async function loadMine(){try{let a=await get("/api/my-bookings?init_data="+encodeURIComponent(tg?.initData||""));document.getElementById("mineList").innerHTML=a.length?a.map(x=>`<div class="card"><b>${x.date} ${x.time}</b><div class="muted">${x.duration} минут</div><button class="btn" onclick="cancelBooking('${x.id}')">Отменить</button></div>`).join(""):"<div class='card muted'>Активных записей нет.</div>"}catch(e){document.getElementById("mineList").innerHTML="<div class='card err'>Не удалось загрузить записи.</div>"}}
async function cancelBooking(id){try{await get("/api/bookings/"+id,{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({init_data:tg?.initData||""})});loadMine()}catch(e){alert("Ошибка отмены")}}
async function loadProgram(){try{let x=await get("/api/me?init_data="+encodeURIComponent(tg?.initData||""));let p=x.program,k=x.kbju,t=x.today;document.getElementById("programData").innerHTML=`<div class="card"><b>Программа</b><p>${p.text||"Не назначена"}</p></div><div class="card"><b>КБЖУ</b><p>${k.calories??"—"} ккал · Б ${k.protein??"—"} · Ж ${k.fat??"—"} · У ${k.carbs??"—"}</p></div><div class="card"><b>Сегодня</b><p>${t.entries?t.calories+" ккал · Б "+t.protein+" · Ж "+t.fat+" · У "+t.carbs:"Питание ещё не записано"}</p></div>`}catch(e){document.getElementById("programData").innerHTML="<div class='card err'>Не удалось загрузить программу.</div>"}}
async function checkTrainer(){try{let x=await get("/api/admin/whoami?init_data="+encodeURIComponent(tg?.initData||""));if(x.is_trainer)document.getElementById("b3").style.display=""}catch(e){}}
async function saveWeekly(){let days=document.getElementById("tdays").value.split(",").map(x=>x.trim()).filter(Boolean),times=document.getElementById("ttimes").value.split(",").map(x=>x.trim()).filter(Boolean);try{await get("/api/admin/weekly",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({init_data:tg?.initData||"",days,times})});document.getElementById("tstatus").textContent="Сохранено";state.slots={};loadWeek()}catch(e){document.getElementById("tstatus").textContent="Ошибка: "+e.message}}
async function loadTrainer(){try{let a=await get("/api/admin/clients?init_data="+encodeURIComponent(tg?.initData||""));document.getElementById("clients").innerHTML=a.map(c=>`<div class="card" onclick="client(${c.telegram_id})"><b>${c.first_name||c.telegram_id}</b><div class="muted">${c.program_text?"программа":"без программы"} · ${c.calories?"КБЖУ":"без КБЖУ"}</div></div>`).join("")}catch(e){}}
async function client(id){let a=await get("/api/admin/clients?init_data="+encodeURIComponent(tg?.initData||""));let c=a.find(x=>x.telegram_id===id);if(!c)return;document.getElementById("client").innerHTML=`<div class="card"><b>${c.first_name||id}</b><textarea id="cp">${c.program_text||""}</textarea><button class="btn" onclick="saveP(${id})">Сохранить программу</button><div class="row"><input id="cc" value="${c.calories??""}"><input id="cpn" value="${c.protein??""}"><input id="cf" value="${c.fat??""}"><input id="cu" value="${c.carbs??""}"></div><button class="btn" onclick="saveK(${id})">Сохранить КБЖУ</button></div>`}
async function saveP(id){await get("/api/admin/clients/"+id+"/program",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({init_data:tg.initData,program_text:document.getElementById("cp").value})});loadTrainer()}
async function saveK(id){let n=x=>parseInt(document.getElementById(x).value);await get("/api/admin/clients/"+id+"/kbju",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({init_data:tg.initData,calories:n("cc"),protein:n("cpn"),fat:n("cf"),carbs:n("cu")})});loadTrainer()}
loadWeek();checkTrainer();
</script></body></html>
